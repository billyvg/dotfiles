# Linux-specific tmux configuration
# Sourced from ~/.tmux.conf when running on Linux

# Linux doesn't require special default-command
# default-command is intentionally left empty

# Linux copy mode bindings using xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
